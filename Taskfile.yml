version: '3'
includes:
  release:
    taskfile: .repo-policy/Taskfile.yml
    dir: .
tasks:
  install:
    cmds: ['npm ci --ignore-scripts']
  build:
    cmds: ['npm run build']
  test:
    cmds: ['npm test']
  typecheck:
    cmds: ['npm run typecheck']
  lint:
    cmds: ['npm run lint']
  check:
    deps: [test, typecheck, lint]
    cmds: ['npm run build']
